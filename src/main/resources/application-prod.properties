# === MySQL (prod profile) ===
spring.datasource.url=jdbc:mysql://localhost:3306/rubrica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rubrica_user
spring.datasource.password=rubrica_pass

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Logging
logging.level.com.interview.app=INFO
